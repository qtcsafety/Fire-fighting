<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตรวจอุปกรณ์ป้องกันอัคคีภัย</title>

<!-- ===== โลโก้ที่แถบเบราว์เซอร์ + ไอคอนหน้าจอโฮม =====
     ต้องอัปโหลดไฟล์เหล่านี้ไว้โฟลเดอร์เดียวกับ index.html:
     favicon-32.png, icon-180.png, icon-192.png, icon-512.png, manifest.webmanifest -->
<link rel="icon" type="image/png" sizes="32x32" href="fire32.png">
<link rel="icon" type="image/png" sizes="192x192" href="fire192.png">
<link rel="apple-touch-icon" sizes="180x180" href="fire180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c0392b">
<meta name="application-name" content="Safety APP">
<meta name="apple-mobile-web-app-title" content="Safety APP">

<!-- ทางเลือก: ใช้อีโมจิเป็นไอคอนที่แถบเบราว์เซอร์ (ไม่ต้องมีไฟล์รูป)
     ถ้าต้องการใช้ ให้ลบ 2 บรรทัด <link rel="icon"> ด้านบน แล้วเอาคอมเมนต์บรรทัดล่างนี้ออก
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧯%3C/text%3E%3C/svg%3E">
-->
</head>
<body style="margin:0;">
<!-- URL เว็บแอป Google Apps Script จริง (Deploy > Manage deployments > คัดลอก "Web app" URL ต้องลงท้าย /exec) -->
<script>
  var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyS2WktlKeNXH7ogqRA6cZ6ITXm2AhEP4xM1PbuBXGlzFQQWMzo-w0XYq4DAQ3rUjMk/exec";

  /* หน้านี้คือ "หน้ากลาง" บน GitHub Pages (https://qtcsafety.github.io/Fire-fighting/)
   * เมื่อผู้ใช้สแกน QR เสร็จที่ scanner.html แล้วเบราว์เซอร์จะพากลับมาที่หน้านี้พร้อม
   * ?scanTag=TAG ต่อท้าย — สคริปต์นี้อ่านค่า scanTag จาก URL ของหน้าตัวเอง
   * แล้วต่อเข้าไปใน src ของ iframe ที่ชี้ไปเว็บแอป Apps Script จริง */
  var params = new URLSearchParams(location.search);
  var scanTag = params.get('scanTag');
  var iframeSrc = APPS_SCRIPT_URL + (scanTag ? '?scanTag=' + encodeURIComponent(scanTag) : '');

  var iframe = document.createElement('iframe');
  iframe.style.width = '100%';
  iframe.style.height = '100vh';
  iframe.style.border = '0';
  iframe.scrolling = 'yes';
  iframe.src = iframeSrc;
  document.body.appendChild(iframe);
</script>
</body>
</html>
